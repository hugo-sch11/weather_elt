weather_analytics:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: '/mnt/storage/container/weather_analytics.duckdb'
      threads: 4
      extensions:
        - httpfs
      settings:
        s3_endpoint: "{{ env_var('MINIO_ENDPOINT') }}"
        s3_access_key_id: "{{ env_var('MINIO_ROOT_USER') }}"
        s3_secret_access_key: "{{ env_var('MINIO_ROOT_PASSWORD') }}"
        s3_region: 'eu-west-3'
        s3_use_ssl: false
        s3_url_style: 'path'
